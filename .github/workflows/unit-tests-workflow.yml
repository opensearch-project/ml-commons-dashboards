name: Unit tests workflow
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
env:
  OPENSEARCH_DASHBOARDS_VERSION: 'main'
jobs:
  Get-CI-Image-Tag:
    uses: opensearch-project/opensearch-build/.github/workflows/get-ci-image-tag.yml@main
    with:
      product: opensearch-dashboards

  tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    needs: Get-CI-Image-Tag
    container:
      # using the same image which is used by opensearch-build team to build the OpenSearch Distribution
      # this image tag is subject to change as more dependencies and updates will arrive over time
      image: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-version-linux }}
      # need to switch to root so that github actions can install runner binary on container without permission issues.
      options: --user root

    steps:
      - name: Checkout OpenSearch Dashboards
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
        with:
          repository: opensearch-project/OpenSearch-Dashboards
          ref: ${{ env.OPENSEARCH_DASHBOARDS_VERSION }}
          path: OpenSearch-Dashboards
      - name: Checkout ML Commons OpenSearch Dashboards plugin
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
        with:
          path: OpenSearch-Dashboards/plugins/ml-commons-dashboards
      - name: Bootstrap / build / unittest
        run: |
          chown -R 1000:1000 `pwd`
          cd ./OpenSearch-Dashboards/
          su `id -un 1000` -c "source $NVM_DIR/nvm.sh && nvm use && node -v && yarn -v &&
                               cd ./plugins/ml-commons-dashboards &&
                               whoami && yarn osd bootstrap && yarn run test:jest --silent --coverage"
      - name: Upload coverage report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jest-coverage-report
          path: OpenSearch-Dashboards/plugins/ml-commons-dashboards/coverage
          retention-days: 1
          if-no-files-found: error

  upload-coverage:
    needs: tests
    name: Upload coverage report to Codecov
    if: ${{ !cancelled() && github.repository == 'opensearch-project/ml-commons-dashboards' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ML Commons OpenSearch Dashboards plugin
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2

      - name: Download coverage report
        id: download-coverage
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: jest-coverage-report
          path: coverage

      - name: Uploads coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: steps.download-coverage.outcome == 'success'
        with:
          directory: coverage
          token: ${{ secrets.CODECOV_TOKEN }}
